<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:Alfa;src:url(../../node_modules/@fontsource/alfa-slab-one/files/alfa-slab-one-latin-400-normal.woff2)}
@font-face{font-family:Yt;src:url(../../node_modules/@fontsource/yellowtail/files/yellowtail-latin-400-normal.woff2)}
@font-face{font-family:Arch;src:url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2);font-weight:100 900;font-stretch:62% 125%}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#1b1512}
.bg{position:absolute;inset:0;background:url(../../src/assets/demos/papulinos/parrilla-carnes.jpg) 100% 50%/cover;transform:translateX(150px) scale(1.12);transform-origin:100% 50%}
.sh{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(27,21,18,.96) 0%,rgba(27,21,18,.84) 40%,rgba(27,21,18,.2) 76%,rgba(27,21,18,.1) 100%),
 linear-gradient(0deg,rgba(27,21,18,.85) 0%,transparent 34%),
 radial-gradient(ellipse 60% 55% at 78% 105%,rgba(255,100,30,.38),transparent 70%)}
.logo{position:absolute;left:64px;top:52px}
h1{position:absolute;left:64px;top:150px;font:400 128px/.94 Alfa;color:#f7f0e2;letter-spacing:-.01em;text-shadow:0 6px 40px rgba(0,0,0,.45)}
h1 b{font-weight:400;color:#ef4a36}
.sc{position:absolute;left:70px;top:420px;font:400 64px/1 Yt;color:#cf9f3f;transform:rotate(-3deg);transform-origin:left}
.ft{position:absolute;left:64px;bottom:44px;font:700 21px Arch;font-stretch:80%;letter-spacing:.2em;color:rgba(247,240,226,.9);text-transform:uppercase}
.ft i{font-style:normal;color:#ef4a36;margin:0 .6em}
.bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:#c8221a}
.e{position:absolute;border-radius:50%}
</style>
<div class=bg></div><div class=sh></div>
<div id=em></div>
<svg class=logo id=lg width=210 viewBox="0 0 320 92"></svg>
<h1>Carnes<br>a la <b>brasa</b></h1>
<div class=sc>de toda la vida</div>
<div class=ft>Malasaña<i>·</i>Santa Paula<i>·</i>Don Cristian<i>·</i>Málaga</div>
<div class=bar></div>
<script>
let seed=7;const rnd=()=>((seed=(seed*9301+49297)%233280)/233280)*2-1;
const W=320,tp=[],bot=[];
for(let x=18;x<=W-18;x+=14){tp.push(`${x},${(9+rnd()*1.6).toFixed(1)}`);bot.push(`${W-x},${(83+rnd()*1.6).toFixed(1)}`)}
const right=['311,15','318,24','309,33','317,44','308,55','316,66','307,76'],left=['10,77','2,68','11,58','3,47','12,37','4,26','13,16'];
const pts=[...tp,...right,...bot,...left].join(' ');
document.getElementById('lg').innerHTML=`<polygon points="${pts}" fill="#c8221a"/><polygon points="${pts}" fill="none" stroke="#f8efe2" stroke-opacity=".35" stroke-width="1.4" transform="translate(160 46) scale(.93 .8) translate(-160 -46)"/><text x="160" y="63" text-anchor="middle" textLength="246" lengthAdjust="spacingAndGlyphs" fill="#f8efe2" style="font-family:Arch;font-weight:850;font-stretch:72%;font-size:52px">PAPULINOS</text>`;
// brasas
let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
let h='';for(let i=0;i<46;i++){const x=480+r()*720,y=630*(.25+r()*.75)*(0.55+0.45*(x/1200)),sz=1.5+r()*3.2,hue=10+r()*28,a=.35+r()*.6;
h+=`<div class=e style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:hsl(${hue+10} 100% 68%);box-shadow:0 0 ${sz*3}px ${sz}px hsla(${hue} 100% 55%/${a*.55});opacity:${a}"></div>`}
document.getElementById('em').innerHTML=h;
</script>
